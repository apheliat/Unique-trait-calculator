<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Trait Comparison Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Fredoka', 'Segoe UI', sans-serif;
            user-select: none;
        }

        body {
            background-color: #12151c;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
            background-size: 24px 24px;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .hud-panel {
            background-color: #2b2e39;
            border: 3px solid #1a1c23;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 900px;
            padding: 24px;
        }

        .hud-header {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #000;
            border-bottom: 2px solid #3b3f4e;
            padding-bottom: 10px;
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #a3a8b8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            background-color: #1a1c23;
            border: 2px solid #3d4252;
            border-radius: 8px;
            color: #ffffff;
            padding: 10px;
            font-size: 1rem;
            font-weight: 700;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #4e82ee;
        }

        /* Checkbox Selection Area */
        .trait-selection-container {
            background-color: #1a1c23;
            border: 2px solid #3d4252;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 24px;
        }

        .trait-checkboxes {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 8px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #4e82ee;
        }

        /* Tables Grid */
        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .trait-card {
            background-color: #1e2029;
            border-radius: 10px;
            border: 2px solid #14151b;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .trait-card-title {
            background-color: #383d4c;
            color: #ffffff;
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 8px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #14151b;
            text-shadow: 1px 1px 0px #000;
        }

        .stats-list {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-card {
            background-color: #2b2e39;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #383d4c;
        }

        .stat-label {
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 0;
            color: #ffffff;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
        }

        .bg-health { background-color: #3b8226; }
        .bg-dps { background-color: #8b3a3a; }
        .bg-size { background-color: #8c734b; }
        .bg-speed { background-color: #4b6b8c; }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
            padding: 6px 2px;
            color: #ffffff;
            text-shadow: 1px 1px 2px #000;
        }

        @media (max-width: 600px) {
            .input-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>

<div class="hud-panel">
    <div class="hud-header">TRAIT COMPARISON CALCULATOR</div>
    
    <!-- Base Inputs -->
    <div class="input-grid">
        <div class="input-group">
            <label>Base HP</label>
            <input type="number" id="hp" value="5000" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>Base DPS</label>
            <input type="number" id="dps" value="2" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>Base Size</label>
            <input type="number" id="size" value="5" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>Base Speed</label>
            <input type="number" id="speed" value="25" oninput="calculate()">
        </div>
    </div>

    <!-- Select Traits -->
    <div class="trait-selection-container">
        <label>Select Traits to Compare</label>
        <div class="trait-checkboxes">
            <label class="checkbox-label"><input type="checkbox" id="chk-gloom" checked onchange="calculate()"> Gloom</label>
            <label class="checkbox-label"><input type="checkbox" id="chk-awakened" checked onchange="calculate()"> Awakened</label>
            <label class="checkbox-label"><input type="checkbox" id="chk-ghostly" checked onchange="calculate()"> Ghostly</label>
            <label class="checkbox-label"><input type="checkbox" id="chk-lightning" checked onchange="calculate()"> Lightning</label>
        </div>
    </div>

    <!-- Output Tables Grid -->
    <div class="tables-grid" id="tables-container">
        <!-- Generated dynamically via JavaScript -->
    </div>
</div>

<script>
function calculate() {
    let baseHp = parseFloat(document.getElementById('hp').value) || 0;
    let baseDps = parseFloat(document.getElementById('dps').value) || 0;
    let baseSize = parseFloat(document.getElementById('size').value) || 0;
    let baseSpeed = parseFloat(document.getElementById('speed').value) || 0;

    const traits = [
        { id: 'chk-gloom', name: 'Gloom' },
        { id: 'chk-awakened', name: 'Awakened' },
        { id: 'chk-ghostly', name: 'Ghostly' },
        { id: 'chk-lightning', name: 'Lightning' }
    ];

    const container = document.getElementById('tables-container');
    container.innerHTML = '';

    traits.forEach(trait => {
        if (document.getElementById(trait.id).checked) {
            let hp = baseHp;
            let dps = baseDps;
            let size = baseSize;
            let speed = baseSpeed;

            if (trait.name === "Gloom") {
                speed *= 0.50;
                hp *= 3.00;
                size -= 2;
            } else if (trait.name === "Awakened") {
                hp *= 2.50;
                dps *= 2.50;
            } else if (trait.name === "Ghostly") {
                hp *= 2.00;
                dps *= 2.00;
                speed *= 1.50;
                size -= 1;
            } else if (trait.name === "Lightning") {
                dps *= 3.00;
            }

            size = Math.max(1, size);

            // Create Trait Table Card
            const card = document.createElement('div');
            card.className = 'trait-card';
            card.innerHTML = `
                <div class="trait-card-title">${trait.name}</div>
                <div class="stats-list">
                    <div class="stat-card">
                        <div class="stat-label bg-health">HEALTH</div>
                        <div class="stat-value">${Math.round(hp).toLocaleString()}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label bg-dps">DPS</div>
                        <div class="stat-value">${Math.round(dps).toLocaleString()}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label bg-size">SIZE</div>
                        <div class="stat-value">${Math.round(size).toLocaleString()}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label bg-speed">SPEED</div>
                        <div class="stat-value">${Math.round(speed).toLocaleString()}</div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        }
    });
}

// Initial Run
calculate();
</script>

</body>
</html>
