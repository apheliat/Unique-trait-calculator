<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Trait Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Fredoka', 'Segoe UI', sans-serif;
            user-select: none;
        }

        body {
            background-color: #12151c;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
            background-size: 24px 24px;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .hud-panel {
            background-color: #2b2e39;
            border: 3px solid #1a1c23;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 480px;
            padding: 24px;
        }

        .hud-header {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 16px;
            text-shadow: 2px 2px 0px #000;
        }

        /* Mode Selector Tabs */
        .mode-toggle {
            display: flex;
            background-color: #1a1c23;
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #383d4c;
        }

        .mode-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            background: transparent;
            color: #a3a8b8;
            font-weight: 700;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .mode-btn.active {
            background-color: #4e82ee;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group.full-width {
            grid-column: span 2;
            margin-top: 4px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #a3a8b8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            background-color: #1a1c23;
            border: 2px solid #3d4252;
            border-radius: 8px;
            color: #ffffff;
            padding: 10px;
            font-size: 1rem;
            font-weight: 700;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: #4e82ee;
        }

        select {
            cursor: pointer;
        }

        /* Results Display Section */
        .results-header {
            text-align: center;
            font-size: 1rem;
            font-weight: 700;
            color: #d1d5db;
            margin-top: 20px;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background-color: #1e2029;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #14151b;
        }

        .stat-card {
            background-color: #2b2e39;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #383d4c;
        }

        .stat-label {
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 0;
            color: #ffffff;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
        }

        .bg-health { background-color: #3b8226; }
        .bg-dps { background-color: #8b3a3a; }
        .bg-size { background-color: #8c734b; }
        .bg-speed { background-color: #4b6b8c; }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
            padding: 8px 2px;
            color: #ffffff;
            text-shadow: 1px 1px 2px #000;
        }
    </style>
</head>
<body>

<div class="hud-panel">
    <div class="hud-header">UNIT CALCULATOR</div>

    <!-- Mode Selector Tabs -->
    <div class="mode-toggle">
        <button id="btn-forward" class="mode-btn active" onclick="setMode('forward')">Base → Traited</button>
        <button id="btn-reverse" class="mode-btn" onclick="setMode('reverse')">Traited → Base</button>
    </div>
    
    <div class="input-grid">
        <div class="input-group">
            <label id="lbl-hp">Base HP</label>
            <input type="number" id="hp" value="5000" oninput="calculate()">
        </div>
        <div class="input-group">
            <label id="lbl-dps">Base DPS</label>
            <input type="number" id="dps" value="2" oninput="calculate()">
        </div>
        <div class="input-group">
            <label id="lbl-size">Base Size</label>
            <input type="number" id="size" value="5" oninput="calculate()">
        </div>
        <div class="input-group">
            <label id="lbl-speed">Base Speed</label>
            <input type="number" id="speed" value="25" oninput="calculate()">
        </div>
        
        <div class="input-group full-width">
            <label>Select Trait</label>
            <select id="trait" onchange="calculate()">
                <option value="None">None</option>
                <option value="Gloom">Gloom</option>
                <option value="Awakened">Awakened</option>
                <option value="Ghostly">Ghostly</option>
                <option value="Lightning">Lightning</option>
            </select>
        </div>
    </div>

    <div class="results-header" id="results-title">MODIFIED STATS</div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label bg-health">HEALTH</div>
            <div class="stat-value" id="out-hp">5,000</div>
        </div>
        <div class="stat-card">
            <div class="stat-label bg-dps">DPS</div>
            <div class="stat-value" id="out-dps">2</div>
        </div>
        <div class="stat-card">
            <div class="stat-label bg-size">SIZE</div>
            <div class="stat-value" id="out-size">5</div>
        </div>
        <div class="stat-card">
            <div class="stat-label bg-speed">SPEED</div>
            <div class="stat-value" id="out-speed">25</div>
        </div>
    </div>
</div>

<script>
let currentMode = 'forward';

function setMode(mode) {
    currentMode = mode;
    
    const btnForward = document.getElementById('btn-forward');
    const btnReverse = document.getElementById('btn-reverse');
    const resultsTitle = document.getElementById('results-title');

    if (mode === 'forward') {
        btnForward.classList.add('active');
        btnReverse.classList.remove('active');
        resultsTitle.innerText = "MODIFIED STATS";
        
        document.getElementById('lbl-hp').innerText = "Base HP";
        document.getElementById('lbl-dps').innerText = "Base DPS";
        document.getElementById('lbl-size').innerText = "Base Size";
        document.getElementById('lbl-speed').innerText = "Base Speed";
    } else {
        btnReverse.classList.add('active');
        btnForward.classList.remove('active');
        resultsTitle.innerText = "ORIGINAL BASE STATS";

        document.getElementById('lbl-hp').innerText = "Current HP";
        document.getElementById('lbl-dps').innerText = "Current DPS";
        document.getElementById('lbl-size').innerText = "Current Size";
        document.getElementById('lbl-speed').innerText = "Current Speed";
    }

    calculate();
}

function calculate() {
    let hp = parseFloat(document.getElementById('hp').value) || 0;
    let dps = parseFloat(document.getElementById('dps').value) || 0;
    let size = parseFloat(document.getElementById('size').value) || 0;
    let speed = parseFloat(document.getElementById('speed').value) || 0;
    let trait = document.getElementById('trait').value;

    if (currentMode === 'forward') {
        // Forward Calculation: Base -> Traited
        if (trait === "Gloom") {
            speed *= 0.50;
            hp *= 3.00;
            size -= 2;
        } else if (trait === "Awakened") {
            hp *= 2.50;
            dps *= 2.50;
        } else if (trait === "Ghostly") {
            hp *= 2.00;
            dps *= 2.00;
            speed *= 1.50;
            size -= 1;
        } else if (trait === "Lightning") {
            dps *= 3.00;
        }
    } else {
        // Reverse Calculation: Traited -> Base
        if (trait === "Gloom") {
            speed /= 0.50;
            hp /= 3.00;
            size += 2;
        } else if (trait === "Awakened") {
            hp /= 2.50;
            dps /= 2.50;
        } else if (trait === "Ghostly") {
            hp /= 2.00;
            dps /= 2.00;
            speed /= 1.50;
            size += 1;
        } else if (trait === "Lightning") {
            dps /= 3.00;
        }
    }

    size = Math.max(1, size);

    document.getElementById('out-hp').innerText = Math.round(hp).toLocaleString();
    document.getElementById('out-dps').innerText = Math.round(dps).toLocaleString();
    document.getElementById('out-size').innerText = Math.round(size).toLocaleString();
    document.getElementById('out-speed').innerText = Math.round(speed).toLocaleString();
}

// Initial Run
calculate();
</script>

</body>
</html>
