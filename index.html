<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Trait Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
        }
        h2 { text-align: center; margin-bottom: 1.5rem; color: #38bdf8; }
        .input-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: #94a3b8; }
        input, select {
            width: 100%;
            padding: 0.6rem;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #334155;
        }
        .stat-box {
            background-color: #0f172a;
            padding: 0.8rem;
            border-radius: 8px;
            text-align: center;
        }
        .stat-title { font-size: 0.8rem; color: #94a3b8; }
        .stat-value { font-size: 1.2rem; font-weight: bold; color: #38bdf8; margin-top: 0.2rem; }
    </style>
</head>
<body>

<div class="card">
    <h2>⚔️ Trait Calculator</h2>
    
    <div class="input-group">
        <label>Base HP</label>
        <input type="number" id="hp" value="100" oninput="calculate()">
    </div>
    <div class="input-group">
        <label>Base Speed</label>
        <input type="number" id="speed" value="10" oninput="calculate()">
    </div>
    <div class="input-group">
        <label>Base DPS</label>
        <input type="number" id="dps" value="50" oninput="calculate()">
    </div>
    <div class="input-group">
        <label>Base Size / Supply</label>
        <input type="number" id="size" value="5" oninput="calculate()">
    </div>
    <div class="input-group">
        <label>Select Trait</label>
        <select id="trait" onchange="calculate()">
            <option value="None">None</option>
            <option value="Gloom">Gloom</option>
            <option value="Awakened">Awakened</option>
            <option value="Ghostly">Ghostly</option>
            <option value="Lightning">Lightning</option>
        </select>
    </div>

    <div class="results">
        <div class="stat-box"><div class="stat-title">HP</div><div class="stat-value" id="out-hp">100</div></div>
        <div class="stat-box"><div class="stat-title">Speed</div><div class="stat-value" id="out-speed">10</div></div>
        <div class="stat-box"><div class="stat-title">DPS</div><div class="stat-value" id="out-dps">50</div></div>
        <div class="stat-box"><div class="stat-title">Size</div><div class="stat-value" id="out-size">5</div></div>
    </div>
</div>

<script>
function calculate() {
    let hp = parseFloat(document.getElementById('hp').value) || 0;
    let speed = parseFloat(document.getElementById('speed').value) || 0;
    let dps = parseFloat(document.getElementById('dps').value) || 0;
    let size = parseFloat(document.getElementById('size').value) || 0;
    let trait = document.getElementById('trait').value;

    if (trait === "Gloom") {
        speed *= 0.50;
        hp *= 3.00;
        size -= 2;
    } else if (trait === "Awakened") {
        hp *= 2.50;
        dps *= 2.50;
    } else if (trait === "Ghostly") {
        hp *= 2.00;
        dps *= 2.00;
        speed *= 1.50;
        size -= 1;
    } else if (trait === "Lightning") {
        dps *= 3.00;
    }

    size = Math.max(1, size);

    document.getElementById('out-hp').innerText = hp.toFixed(1);
    document.getElementById('out-speed').innerText = speed.toFixed(1);
    document.getElementById('out-dps').innerText = dps.toFixed(1);
    document.getElementById('out-size').innerText = size.toFixed(1);
}
</script>

</body>
</html>
