<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Trait Comparison Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Fredoka', 'Segoe UI', sans-serif;
            user-select: none;
        }

        body {
            background-color: #12151c;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
            background-size: 24px 24px;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .hud-panel {
            background-color: #2b2e39;
            border: 3px solid #1a1c23;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 800px;
            padding: 24px;
        }

        .hud-header {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #000;
            border-bottom: 2px solid #3b3f4e;
            padding-bottom: 10px;
        }

        /* Flexible Grid for Inputs */
        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #a3a8b8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            background-color: #1a1c23;
            border: 2px solid #3d4252;
            border-radius: 8px;
            color: #ffffff;
            padding: 8px 10px;
            font-size: 0.95rem;
            font-weight: 700;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        input:focus {
            border-color: #4e82ee;
        }

        /* Checkbox Selection Area */
        .trait-selection-container {
            background-color: #1a1c23;
            border: 2px solid #3d4252;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
        }

        .trait-checkboxes {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 6px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
            color: #ffffff;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #4e82ee;
        }

        /* Comparison Table Styling */
        .table-wrapper {
            background-color: #1e2029;
            border-radius: 10px;
            border: 2px solid #14151b;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th, td {
            padding: 10px;
            border: 1px solid #2b2e39;
        }

        th {
            background-color: #282c37;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a3a8b8;
        }

        th.trait-header {
            background-color: #383d4c;
            color: #ffffff;
            font-size: 1rem;
            text-shadow: 1px 1px 0px #000;
        }

        td.stat-tag-cell {
            width: 120px;
            padding: 6px;
        }

        .stat-tag {
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 6px 0;
            border-radius: 4px;
            color: #ffffff;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
        }

        .bg-health { background-color: #3b8226; }
        .bg-dps { background-color: #8b3a3a; }
        .bg-size { background-color: #8c734b; }
        .bg-speed { background-color: #4b6b8c; }

        .stat-val {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 1px 1px 2px #000;
        }

        /* Highlight Classes */
        .stat-val.better {
            color: #4ade80 !important; /* Green */
        }

        .stat-val.worse {
            color: #f87171 !important; /* Red */
        }
    </style>
</head>
<body>

<div class="hud-panel">
    <div class="hud-header">TRAIT COMPARISON CALCULATOR</div>
    
    <!-- Base Inputs -->
    <div class="input-grid">
        <div class="input-group">
            <label>Base HP</label>
            <input type="number" id="hp" value="5000" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>Base DPS</label>
            <input type="number" id="dps" value="160" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>Base Size</label>
            <input type="number" id="size" value="5" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>Base Speed</label>
            <input type="number" id="speed" value="25" oninput="calculate()">
        </div>
    </div>

    <!-- Select Traits -->
    <div class="trait-selection-container">
        <label>Select Traits to Compare</label>
        <div class="trait-checkboxes">
            <label class="checkbox-label"><input type="checkbox" id="chk-gloom" onchange="calculate()"> Gloom</label>
            <label class="checkbox-label"><input type="checkbox" id="chk-awakened" checked onchange="calculate()"> Awakened</label>
            <label class="checkbox-label"><input type="checkbox" id="chk-ghostly" onchange="calculate()"> Ghostly</label>
            <label class="checkbox-label"><input type="checkbox" id="chk-lightning" onchange="calculate()"> Lightning</label>
        </div>
    </div>

    <!-- Output Table -->
    <div class="table-wrapper">
        <table id="comparison-table">
            <!-- Dynamically populated -->
        </table>
    </div>
</div>

<script>
function calculate() {
    let baseHp = parseFloat(document.getElementById('hp').value) || 0;
    let baseDps = parseFloat(document.getElementById('dps').value) || 0;
    let baseSize = parseFloat(document.getElementById('size').value) || 0;
    let baseSpeed = parseFloat(document.getElementById('speed').value) || 0;

    const traitDefs = [
        { id: 'chk-gloom', name: 'Gloom' },
        { id: 'chk-awakened', name: 'Awakened' },
        { id: 'chk-ghostly', name: 'Ghostly' },
        { id: 'chk-lightning', name: 'Lightning' }
    ];

    // Filter checked traits
    let selectedTraits = traitDefs.filter(t => document.getElementById(t.id).checked);

    // Calculate modified stats for selected traits
    let traitData = selectedTraits.map(t => {
        let hp = baseHp;
        let dps = baseDps;
        let size = baseSize;
        let speed = baseSpeed;

        if (t.name === "Gloom") {
            speed *= 0.50;
            hp *= 3.00;
            size -= 2;
        } else if (t.name === "Awakened") {
            hp *= 2.50;
            dps *= 2.50;
        } else if (t.name === "Ghostly") {
            hp *= 2.00;
            dps *= 2.00;
            speed *= 1.50;
            size -= 1;
        } else if (t.name === "Lightning") {
            // Adjusted multiplier to match in-game 4.5x scaling
            dps *= 4.50;
        }

        size = Math.max(1, size);

        return {
            name: t.name,
            hp: hp,
            dps: dps,
            size: size,
            speed: speed
        };
    });

    const table = document.getElementById('comparison-table');
    
    if (selectedTraits.length === 0) {
        table.innerHTML = `<tr><td style="padding:20px; color:#a3a8b8;">Please select at least one trait above.</td></tr>`;
        return;
    }

    // Determine colors when comparing exactly 2 traits
    const isComparingTwo = (selectedTraits.length === 2);

    function getStatClass(statKey, valA, valB, isTraitA) {
        if (!isComparingTwo) return '';
        
        let higherIsBetter = true;
        if (statKey === 'size') higherIsBetter = false;

        const currentVal = isTraitA ? valA : valB;
        const otherVal = isTraitA ? valB : valA;

        if (currentVal === otherVal) return '';

        if (higherIsBetter) {
            return currentVal > otherVal ? 'better' : 'worse';
        } else {
            return currentVal < otherVal ? 'better' : 'worse';
        }
    }

    // Build Table Header
    let headerHTML = `<thead><tr><th class="stat-tag-cell">STAT</th>`;
    traitData.forEach(t => {
        headerHTML += `<th class="trait-header">${t.name}</th>`;
    });
    headerHTML += `</tr></thead>`;

    // Stats config
    const statsList = [
        { key: 'hp', label: 'HEALTH', class: 'bg-health' },
        { key: 'dps', label: 'DPS', class: 'bg-dps' },
        { key: 'size', label: 'SIZE', class: 'bg-size' },
        { key: 'speed', label: 'SPEED', class: 'bg-speed' }
    ];

    // Build Table Body
    let bodyHTML = `<tbody>`;
    statsList.forEach(stat => {
        bodyHTML += `<tr>
            <td class="stat-tag-cell">
                <div class="stat-tag ${stat.class}">${stat.label}</div>
            </td>`;
        
        traitData.forEach((t, idx) => {
            let cls = '';
            if (isComparingTwo) {
                const valA = traitData[0][stat.key];
                const valB = traitData[1][stat.key];
                cls = getStatClass(stat.key, valA, valB, idx === 0);
            }

            bodyHTML += `<td class="stat-val ${cls}">${Math.round(t[stat.key]).toLocaleString()}</td>`;
        });

        bodyHTML += `</tr>`;
    });
    bodyHTML += `</tbody>`;

    table.innerHTML = headerHTML + bodyHTML;
}

// Initial Run
calculate();
</script>

</body>
</html>
